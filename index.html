<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorthAPick is closed</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#faf8f5; --fg:#1f1d1a; --muted:#6b665e; --accent:#5b3fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16151a; --fg:#f2f0ec; --muted:#a8a29a; --accent:#a996ff; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center;
    max-width:34rem; margin:0 auto; padding:2rem 1rem; box-sizing:border-box; }
  .mark { width:44px; height:44px; border-radius:10px; background:var(--accent); margin-bottom:1.5rem; }
  h1 { font-size:1.9rem; line-height:1.2; margin:0 0 .75rem; }
  p { margin:0 0 1rem; color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>WorthAPick has closed.</h1>
  <p>Thank you to everyone who searched sold prices and tried picks at estate sales near you.</p>
  <p>The service is no longer running, and no accounts are being charged.</p>
  <p>Questions, feedback or requests? Email <a href="mailto:worthapickr@gmail.com">worthapickr@gmail.com</a>.</p>
</main>
</body>
</html>
